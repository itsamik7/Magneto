<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 160" width="100%" height="100%">
  <defs>
    <linearGradient id="milkGable" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="milkBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="25%" stop-color="#FFFFFF"/>
      <stop offset="80%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="blueBanner" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#dropShadow)">
    <!-- Carton Gable Peak -->
    <polygon points="35,32 60,12 85,32" fill="url(#milkGable)" stroke="#94A3B8" stroke-width="1.2" stroke-linejoin="round"/>
    <line x1="60" y1="12" x2="60" y2="32" stroke="#CBD5E1" stroke-width="1"/>
    <!-- Folded Crest Top -->
    <rect x="52" y="8" width="16" height="5" rx="1" fill="#FFFFFF" stroke="#94A3B8" stroke-width="0.8"/>

    <!-- Main Carton Box Body -->
    <rect x="35" y="32" width="50" height="116" rx="4" fill="url(#milkBody)" stroke="#94A3B8" stroke-width="1.2"/>

    <!-- Blue Top Cap/Ridge -->
    <rect x="35" y="44" width="50" height="42" fill="url(#blueBanner)"/>

    <!-- Cow Silhouette / Pasture Icon -->
    <ellipse cx="60" cy="58" rx="8" ry="5" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="53" cy="56" r="3" fill="#FFFFFF" opacity="0.9"/>
    <text x="60" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">WHOLE MILK</text>
    <text x="60" y="84" font-family="system-ui, -apple-system, sans-serif" font-size="5" font-weight="600" fill="#93C5FD" text-anchor="middle">PASTEURIZED • 1L</text>

    <!-- Bottom details -->
    <path d="M35 110 Q45 106 60 110 T85 110 L85 114 Q70 118 60 114 T35 114 Z" fill="#3B82F6" opacity="0.2"/>
    <rect x="42" y="124" width="36" height="4" rx="1" fill="#E2E8F0"/>
    <rect x="46" y="132" width="28" height="3" rx="1" fill="#CBD5E1"/>
  </g>
</svg>
