<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 100" width="100%" height="100%">
  <defs>
    <linearGradient id="pulpGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D7CCC8"/>
      <stop offset="50%" stop-color="#BCAAA4"/>
      <stop offset="100%" stop-color="#8D6E63"/>
    </linearGradient>
    <linearGradient id="eggGrad1" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFE0B2"/>
      <stop offset="40%" stop-color="#FFCC80"/>
      <stop offset="100%" stop-color="#FFA726"/>
    </linearGradient>
    <filter id="eggShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#eggShadow)">
    <!-- Bottom tray -->
    <path d="M15,55 L25,85 L135,85 L145,55 Z" fill="url(#pulpGrad)" stroke="#6D4C41" stroke-width="1.2"/>
    <!-- Tray indents -->
    <path d="M25,85 L35,58 L45,85 L55,58 L65,85 L75,58 L85,85 L95,58 L105,85 L115,58 L125,85" stroke="#795548" stroke-width="1.5" fill="none" opacity="0.6"/>

    <!-- Six Farm Eggs peeking out -->
    <ellipse cx="35" cy="50" rx="14" ry="17" fill="url(#eggGrad1)" stroke="#FB8C00" stroke-width="0.8"/>
    <ellipse cx="55" cy="48" rx="14" ry="17" fill="url(#eggGrad1)" stroke="#FB8C00" stroke-width="0.8"/>
    <ellipse cx="75" cy="49" rx="14" ry="17" fill="url(#eggGrad1)" stroke="#FB8C00" stroke-width="0.8"/>
    <ellipse cx="95" cy="48" rx="14" ry="17" fill="url(#eggGrad1)" stroke="#FB8C00" stroke-width="0.8"/>
    <ellipse cx="115" cy="50" rx="14" ry="17" fill="url(#eggGrad1)" stroke="#FB8C00" stroke-width="0.8"/>
    <ellipse cx="130" cy="52" rx="12" ry="15" fill="url(#eggGrad1)" stroke="#FB8C00" stroke-width="0.8"/>

    <!-- Open Hinged Lid tilted back -->
    <polygon points="12,50 25,20 135,20 148,50" fill="#EFEBE9" stroke="#A1887F" stroke-width="1.2" opacity="0.95"/>
    <!-- Lid Label -->
    <rect x="40" y="24" width="80" height="20" rx="3" fill="#2E7D32"/>
    <text x="80" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">ORGANIC BROWN EGGS</text>
    <text x="80" y="41" font-family="system-ui, -apple-system, sans-serif" font-size="4.5" font-weight="700" fill="#C8E6C9" text-anchor="middle">GRADE A • FREE RANGE • 6 CT</text>
  </g>
</svg>
