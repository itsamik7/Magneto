<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 130" width="100%" height="100%">
  <defs>
    <linearGradient id="jamLid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="50%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </linearGradient>
    <linearGradient id="jamFruit" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#881337"/>
      <stop offset="40%" stop-color="#9F1239"/>
      <stop offset="70%" stop-color="#BE123C"/>
      <stop offset="100%" stop-color="#4C0519"/>
    </linearGradient>
    <filter id="jamShadow" x="-15%" y="-10%" width="130%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#jamShadow)">
    <!-- Red Gingham Cloth Cap over Lid with tied twine -->
    <path d="M28,24 C28,15 72,15 72,24 C78,25 78,32 72,33 C68,34 32,34 28,33 C22,32 22,25 28,24 Z" fill="url(#jamLid)" stroke="#991B1B" stroke-width="1"/>
    <!-- Gingham grid pattern -->
    <line x1="36" y1="18" x2="36" y2="30" stroke="#FFFFFF" stroke-width="1.2" opacity="0.6"/>
    <line x1="44" y1="16" x2="44" y2="32" stroke="#FFFFFF" stroke-width="1.2" opacity="0.6"/>
    <line x1="52" y1="16" x2="52" y2="32" stroke="#FFFFFF" stroke-width="1.2" opacity="0.6"/>
    <line x1="60" y1="17" x2="60" y2="32" stroke="#FFFFFF" stroke-width="1.2" opacity="0.6"/>
    <line x1="28" y1="24" x2="72" y2="24" stroke="#FFFFFF" stroke-width="1.2" opacity="0.6"/>
    <!-- Twine ribbon -->
    <path d="M27,31 Q50,34 73,31" stroke="#FDE047" stroke-width="1.5" fill="none"/>
    <circle cx="50" cy="33" r="2" fill="#EAB308"/>

    <!-- Glass Jar Body filled with Strawberry Jam -->
    <rect x="25" y="34" width="50" height="82" rx="7" fill="url(#jamFruit)" stroke="#881337" stroke-width="1.2"/>

    <!-- Glass gloss highlight -->
    <path d="M30,40 L30,108" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>

    <!-- Kraft Paper Label -->
    <rect x="28" y="52" width="44" height="46" rx="3" fill="#FFFBEB" stroke="#B45309" stroke-width="0.8"/>
    <!-- Strawberry icon -->
    <path d="M50,56 C46,56 44,60 46,64 C48,68 50,71 50,71 C50,71 52,68 54,64 C56,60 54,56 50,56 Z" fill="#E11D48"/>
    <circle cx="49" cy="62" r="0.5" fill="#FEF08A"/>
    <circle cx="51" cy="62" r="0.5" fill="#FEF08A"/>
    <circle cx="50" cy="65" r="0.5" fill="#FEF08A"/>
    <!-- Calyx green leaves -->
    <path d="M47,56 C49,54 51,54 53,56" stroke="#15803D" stroke-width="1.2" fill="none"/>

    <text x="50" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="5" font-weight="900" fill="#881337" text-anchor="middle">STRAWBERRY</text>
    <text x="50" y="85" font-family="system-ui, -apple-system, sans-serif" font-size="4" font-weight="700" fill="#9F1239" text-anchor="middle">CONSERVE</text>
    <text x="50" y="93" font-family="system-ui, -apple-system, sans-serif" font-size="3" font-weight="600" fill="#78350F" text-anchor="middle">340g • HANDMADE</text>
  </g>
</svg>
