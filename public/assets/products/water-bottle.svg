<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 160" width="100%" height="100%">
  <defs>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#BAE6FD" stop-opacity="0.8"/>
      <stop offset="25%" stop-color="#E0F2FE" stop-opacity="0.95"/>
      <stop offset="70%" stop-color="#7DD3FC" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="waterLabel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <filter id="waterShadow" x="-15%" y="-10%" width="130%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#waterShadow)">
    <!-- Cap -->
    <rect x="42" y="10" width="16" height="12" rx="2" fill="#0284C7" stroke="#0369A1" stroke-width="1"/>
    <line x1="42" y1="14" x2="58" y2="14" stroke="#38BDF8" stroke-width="0.8"/>
    <line x1="42" y1="18" x2="58" y2="18" stroke="#38BDF8" stroke-width="0.8"/>

    <!-- Bottle Neck -->
    <path d="M45,22 L45,36 C45,46 32,54 32,70 L32,142 C32,147 37,150 42,150 L58,150 C63,150 68,147 68,142 L68,70 C68,54 55,46 55,22 Z" fill="url(#glassGrad)" stroke="#0284C7" stroke-width="1.2"/>

    <!-- Water reflection highlight curve -->
    <path d="M38,70 L38,140" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>

    <!-- Mineral Water Label -->
    <rect x="32" y="80" width="36" height="34" rx="2" fill="url(#waterLabel)" stroke="#0284C7" stroke-width="0.8"/>
    <!-- Mountain icon -->
    <polygon points="50,85 58,95 42,95" fill="#FFFFFF" opacity="0.9"/>
    <polygon points="46,90 52,95 40,95" fill="#E0F2FE" opacity="0.8"/>
    <text x="50" y="103" font-family="system-ui, -apple-system, sans-serif" font-size="5" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">ALPINE</text>
    <text x="50" y="109" font-family="system-ui, -apple-system, sans-serif" font-size="3.5" font-weight="600" fill="#BAE6FD" text-anchor="middle">SPRING WATER</text>

    <!-- Bottom water base reflection -->
    <ellipse cx="50" cy="144" rx="14" ry="3" fill="#0284C7" opacity="0.4"/>
  </g>
</svg>
