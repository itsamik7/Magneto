<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="yogurtLid" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="yogurtBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="30%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <filter id="yogurtShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#yogurtShadow)">
    <!-- Foil Lid / Rim with Fluted Edge -->
    <ellipse cx="60" cy="28" rx="38" ry="10" fill="url(#yogurtLid)" stroke="#0369A1" stroke-width="1"/>
    <ellipse cx="60" cy="27" rx="36" ry="8" fill="#E0F2FE" opacity="0.4"/>

    <!-- Ceramic Jar / Pot Body -->
    <path d="M26,30 C24,55 30,85 36,98 C40,104 50,106 60,106 C70,106 80,104 84,98 C90,85 96,55 94,30 Z" fill="url(#yogurtBody)" stroke="#94A3B8" stroke-width="1.2"/>

    <!-- Greek Pattern Blue Rim Banner -->
    <path d="M25,35 Q60,42 95,35 L93,52 Q60,60 27,52 Z" fill="#0284C7"/>
    <!-- Greek meander motif simplified -->
    <path d="M32,44 H38 V40 H44 V46 H38 M50,44 H56 V40 H62 V46 H56 M68,44 H74 V40 H80 V46 H74" stroke="#FFFFFF" stroke-width="1.2" fill="none"/>

    <!-- Label Center -->
    <ellipse cx="60" cy="74" rx="22" ry="14" fill="#FFFFFF" stroke="#BAE6FD" stroke-width="1"/>
    <text x="60" y="73" font-family="system-ui, -apple-system, sans-serif" font-size="6.5" font-weight="900" fill="#0369A1" text-anchor="middle">GREEK</text>
    <text x="60" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="4.5" font-weight="700" fill="#64748B" text-anchor="middle">PLAIN YOGURT</text>
    <text x="60" y="86" font-family="system-ui, -apple-system, sans-serif" font-size="3.5" font-weight="600" fill="#0284C7" text-anchor="middle">500g • 10% FAT</text>

    <!-- Gloss highlight -->
    <path d="M33,48 C32,65 35,85 38,94" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  </g>
</svg>
