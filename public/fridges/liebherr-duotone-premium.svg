<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 689" width="100%" height="100%">
  <defs>
    <filter id="def-shadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="25" stdDeviation="20" flood-color="rgba(15,23,42,0.38)" />
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="rgba(0,0,0,0.18)" />
    </filter>
    <linearGradient id="body-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="metal-handle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
  </defs>
  <g filter="url(#def-shadow)">
    <!-- Chassis Outer -->
    <rect x="15" y="15" width="370" height="659" rx="32" fill="#475569" stroke="#64748B" stroke-width="2" />
    <!-- Door Surface -->
    <rect x="22" y="22" width="356" height="645" rx="26" fill="url(#body-grad)" stroke="#FFFFFF" stroke-width="1.5" />
    <!-- Seam (Top or Bottom split) -->
    <line x1="22" y1="206" x2="378" y2="206"
          stroke="#334155" stroke-width="2.5" opacity="0.6" />
    <!-- Handle Bar on Right -->
    <rect x="354" y="110" width="12" height="447" rx="6" fill="url(#metal-handle)" />
  </g>
</svg>