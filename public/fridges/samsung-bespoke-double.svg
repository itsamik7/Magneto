<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 689" width="100%" height="100%">
  <defs>
    <filter id="bespoke-shadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="25" stdDeviation="20" flood-color="rgba(15,23,42,0.38)" />
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="rgba(0,0,0,0.18)" />
    </filter>
    <linearGradient id="navy-glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="white-glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
  </defs>
  <g filter="url(#bespoke-shadow)">
    <!-- Chassis -->
    <rect x="15" y="15" width="370" height="659" rx="32" fill="#0F172A" />
    <!-- Top Navy Panel -->
    <rect x="22" y="22" width="356" height="220" rx="24"
          fill="url(#navy-glass)" stroke="#334155" stroke-width="2" />
    <!-- Bottom White Glass Panel -->
    <rect x="22" y="241" width="356" height="399" rx="24"
          fill="url(#white-glass)" stroke="#CBD5E1" stroke-width="2" />
    <!-- Recessed Pocket Handles -->
    <rect x="140" y="224" width="120" height="7" rx="3.5" fill="#020617" />
    <rect x="140" y="238" width="120" height="7" rx="3.5" fill="#020617" />
    <!-- Glass Sheen Overlays -->
    <path d="M 22,22 L 200,22 L 22,220 Z" fill="#FFFFFF" opacity="0.12" pointer-events="none" />
    <path d="M 22,241 L 250,241 L 22,620 Z" fill="#FFFFFF" opacity="0.25" pointer-events="none" />
  </g>
</svg>